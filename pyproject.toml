[project.urls]
Homepage = "https://github.com/samm7dx/lockmate"
Repository = "https://github.com/samm7dx/lockmate"
Issues = "https://github.com/samm7dx/lockmate/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lockmate*"]

[tool.pytest.ini_options]
testpaths = ["src/ingestion/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "security: marks tests as security-related",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "PTH", "PL", "TRY", "NPY", "RSE", "SIM", "TID",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "S106"], "src/ingestion/tests/*" = ["S101", "S106"] }
fixable = ["F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "PTH", "PL", "TRY", "NPY", "RSE", "SIM", "TID"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
enable_error_code = ["unused-ignore", "attr-defined"]

[[tool.mypy.overrides]]
module = ["fhir.resources.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/lockmate"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
