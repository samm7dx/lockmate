[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lockmate"
version = "1.0.0"
description = "LOCKMATE — Offline Healthcare Privacy Firewall (Track 3: Secret Wards)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography==42.0.5",
    "charset-normalizer==3.3.2",
    "phonenumbers==8.13.48",
    "dateparser==1.2.0",
    "indic-transliteration==2.3.83",
    "fhir.resources==7.1.0",
    "jsonschema==4.23.0",
    "regex==2024.7.24",
    "pandas==2.2.2",
    "PyYAML==6.0.1",
    "psutil==5.9.8",
    "tqdm==4.66.5",
    "typing-extensions==4.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "bandit==1.7.8",
    "semgrep==1.92.0",
    "pip-audit==2.7.1",
]
ml = [
    "sklearn-crfsuite==0.3.6",
    "scikit-learn==1.5.0",
]
performance = [
    "rapidfuzz==3.9.0",
]
privacy = [
    "anonymeter==0.2.0",
]
synthetic = [
    "Faker==25.4.0",
]

[project.scripts]
lockmate = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secret_wards*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.bandit]
targets = ["src/secret_wards"]
exclude = ["tests/"]

[tool.semgrep]
config = "auto"
paths = ["src/secret_wards"]