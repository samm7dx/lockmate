[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lockmate"
version = "0.1.0"
description = "LOCKMATE — Offline Healthcare Privacy Firewall (Track 3: Secret Wards)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Samridh", email = "samridh@example.com"},
    {name = "Satwilk", email = "satwilk@example.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "cryptography>=42.0",
    "fhir.resources>=7.1",
    "pandas>=2.2",
    "python-magic>=0.4.27",
    "charset-normalizer>=3.3",
    "phonenumbers>=8.13",
    "dateparser>=1.2",
    "indic-transliteration>=2.3",
    "xxhash>=3.4",
    "orjson>=3.9",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "jsonschema>=4.23",
    "regex>=2024.7",
    "ijson>=3.6",
    "psutil>=5.9",
    "tqdm>=4.66",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.92",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "types-python-magic>=0.4.1",
    "bandit>=1.7",
    "semgrep>=1.92",
    "pip-audit>=2.7",
]
ml = [
    "sklearn-crfsuite>=0.3.6",
    "scikit-learn>=1.5",
]
performance = [
    "rapidfuzz>=3.9",
]
privacy = [
    "anonymeter>=0.2",
]
synthetic = [
    "Faker>=25.4",
]

[project.urls]
Homepage = "https://github.com/samm7dx/lockmate"
Repository = "https://github.com/samm7dx/lockmate"
Issues = "https://github.com/samm7dx/lockmate/issues"

[project.scripts]
lockmate = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lockmate*", "secret_wards*"]

[tool.pytest.ini_options]
testpaths = ["src/lockmate/ingestion/tests", "src/secret_wards/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "security: marks tests as security-related",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "PTH", "PL", "TRY", "NPY", "RSE", "SIM", "TID",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "S106"], "src/lockmate/ingestion/tests/*" = ["S101", "S106"], "src/secret_wards/tests/*" = ["S101", "S106"] }
fixable = ["F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "PTH", "PL", "TRY", "NPY", "RSE", "SIM", "TID"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
enable_error_code = ["unused-ignore", "attr-defined"]

[[tool.mypy.overrides]]
module = ["fhir.resources.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/lockmate", "src/secret_wards"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
targets = ["src/lockmate", "src/secret_wards"]
exclude = ["tests/", "src/*/tests/"]

[tool.semgrep]
config = "auto"
paths = ["src/lockmate", "src/secret_wards"]